name: "Copilot Setup Steps"
permissions: {}
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml
jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest
        permissions:
            contents: read # Required to checkout for the renv lockfile
        env:
            R_LIBS_USER: ${{ github.workspace }}/.rlibs
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Set up R
              uses: r-lib/actions/setup-r@v2
              with:
                  r-version: "4.5"
                  use-public-rspm: true

            # Install from the dated PPM snapshot pinned in DESCRIPTION
            # (Config/Repo/Snapshot). Same source of truth as local dev — no
            # renv::restore (which deadlocks on openxlsx<->zip on Linux) and no
            # hand-maintained package list to drift.
            - name: Install R dependencies
              shell: bash
              run: |
                  mkdir -p "$R_LIBS_USER"
                  Rscript scripts/sync_r_packages.R
