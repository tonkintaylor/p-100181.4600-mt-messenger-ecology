name: "Copilot Setup Steps"
permissions: {}
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml
jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest
        permissions:
            contents: read # Required to checkout for the renv lockfile
        env:
            # Serialize package installs: renv's parallel installer deadlocks
            # on the openxlsx<->zip pair on Linux (each reported as the other's
            # failed dependency). One job at a time avoids the scheduler issue.
            RENV_CONFIG_INSTALL_JOBS: "1"
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Set up R
              uses: r-lib/actions/setup-r@v2
              with:
                  r-version: "4.5"
                  use-public-rspm: true

            # Ensure a CRAN mirror is set in Rprofile.site (read at startup,
            # before the renv project .Rprofile) so setup-renv's bootstrap
            # `install.packages("renv")` has a mirror.
            - name: Configure CRAN mirror
              shell: bash
              run: |
                  R_ETC="$(Rscript -e 'cat(R.home("etc"))')"
                  echo 'options(repos = c(CRAN = "https://cloud.r-project.org"))' | sudo tee -a "$R_ETC/Rprofile.site"

            - name: Set up renv
              uses: r-lib/actions/setup-renv@v2
