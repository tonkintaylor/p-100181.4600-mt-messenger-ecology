name: Tests
permissions: {}
on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    pull_request:
        paths-ignore:
            - "docs/**"
            - "**/*.md"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    tests:
        name: Run
        runs-on: "ubuntu-latest"
        permissions:
            contents: read # Required to checkout the test suite
        env:
            R_LIBS_USER: ${{ github.workspace }}/.rlibs
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Set up R
              uses: r-lib/actions/setup-r@v2
              with:
                  r-version: "4.5"
                  use-public-rspm: true

            # renv::restore has an upstream resolver bug on Linux that deadlocks
            # the openxlsx<->zip pair, so install the dependencies directly from
            # the public RSPM binaries instead. renv.lock is retained for local
            # reproducibility; CI installs current versions of the same packages.
            - name: Install R dependencies
              shell: bash
              run: |
                  rm -f .Rprofile   # don't auto-activate renv for these R sessions
                  mkdir -p "$R_LIBS_USER"
                  Rscript -e 'install.packages(c("readxl","openxlsx","dplyr","tidyr","lubridate","ggplot2","vegan","indicspecies","ggrepel","zoo","patchwork","RcppTOML","testthat","R6","withr"))'

            - name: Run testthat suite
              run: >
                Rscript -e "
                  library(readxl);
                  library(openxlsx);
                  library(dplyr);
                  library(tidyr);
                  library(lubridate);
                  testthat::test_dir('tests/r', stop_on_failure=TRUE)
                "
