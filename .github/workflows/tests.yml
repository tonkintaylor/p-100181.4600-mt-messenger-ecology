name: Tests
permissions: {}
on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    pull_request:
        paths-ignore:
            - "docs/**"
            - "**/*.md"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    tests:
        name: Run
        # Windows, not Linux: renv::restore deadlocks on the openxlsx<->zip pair
        # on Linux, and the pipeline ships to Windows anyway (the launcher bundles
        # a Windows R). See docs/usage.md "R package management".
        runs-on: "windows-latest"
        permissions:
            contents: read # Required to checkout the test suite
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Set up R
              uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
              with:
                  r-version: "4.5"
                  use-public-rspm: true

            # Install renv and restore the exact package versions from renv.lock
            # (the single source of truth). Caches the renv library between runs.
            - name: Restore renv library
              uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

            - name: Run testthat suite
              run: Rscript -e "library(readxl); library(openxlsx); library(dplyr); library(tidyr); library(lubridate); testthat::test_dir('tests/r', stop_on_failure=TRUE)"
