name: Tests
permissions: {}
on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    pull_request:
        paths-ignore:
            - "docs/**"
            - "**/*.md"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    tests:
        name: Run
        runs-on: "ubuntu-latest"
        permissions:
            contents: read # Required to checkout the test suite
        env:
            PYTHONIOENCODING: utf-8
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: latest

            - name: Setup dependencies
              run: uv sync

            - name: Run pytest
              uses: pavelzw/pytest-action@510c5e90c360a185039bea56ce8b3e7e51a16507 # v2.2.0
              with:
                  emoji: false
                  job-summary: false
                  custom-pytest: uv run --frozen pytest --cov --junitxml=junit.xml -o junit_family=legacy --cov-report=xml

            - name: Upload coverage reports
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: coverage-reports
                  path: coverage.xml


    sonarqube:
        name: SonarQube Analysis
        needs: tests
        runs-on: ubuntu-latest
        environment: sonarqube
        permissions:
            contents: read # Required to infer project metadata and run the analysis
            pull-requests: write # SonarQube needs to post comments on PRs
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0 # No shallow clones, SonarQube uses the full history
                  persist-credentials: false

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: latest
                  cache-suffix: sonarqube

            - name: Create SonarQube properties
              run: uvx usethis@0.21.0 show sonarqube --project-key=$SONAR_PROJECT_KEY --output-file=sonar-project.properties
              env:
                  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

            - name: Download coverage reports
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: coverage-reports
              continue-on-error: true

            - name: Run SonarQube analysis
              uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

